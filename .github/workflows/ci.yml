name: CI — Testes Automatizados (ETL + API + Frontend)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "**"]

jobs:
  test-pipeline-and-api:
    name: Validar ETL e API (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Rodar Testes Automatizados do ETL (Limpeza, CEP Mock e Guardrails)
        run: |
          python -m unittest discover -s tests -v

      - name: 5. Validar execução completa do Pipeline ETL
        run: |
          python -m etl.pipeline

      - name: 6. Rodar Testes Automatizados da API Django (Vendedores e Clientes)
        working-directory: api
        run: |
          python manage.py test -v 2

  test-frontend:
    name: Validar experiência interativa (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Instalar dependências do frontend
        run: npm ci

      - name: 4. Testar API-first e fallback local
        run: npm test

      - name: 5. Compilar a versão de produção
        run: npm run build
