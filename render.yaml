databases:
  - name: desafio-primora-db
    plan: free
    databaseName: primora
    user: primora

services:
  - type: web
    name: desafio-primora-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python api/manage.py collectstatic --noinput
    startCommand: python api/manage.py migrate --noinput && python api/manage.py bootstrap_primora --if-empty && gunicorn --chdir api config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: desafio-primora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://desafio-primora.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://desafio-primora.onrender.com
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: desafio-primora
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://desafio-primora-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
