openapi: 3.0.3
info:
  title: API Primora — Distribuidora Vetor
  version: 1.0.0
  description: Consultas públicas de clientes exibem somente os dois últimos dígitos
    do CNPJ, os quatro últimos do telefone e a inicial e o domínio do e-mail. Contas
    autenticadas consultam os valores completos e podem alterar os cadastros. Exclusões
    com vínculos protegidos retornam HTTP 409.
paths:
  /api/apresentacao/metricas/:
    get:
      operationId: apresentacao_metricas_retrieve
      description: Agregados seguros para a apresentação; nunca expõe linhas da auditoria.
      tags:
      - apresentacao
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Valida o token do painel e informa quem pode manter os cadastros.
      tags:
      - auth
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardUser'
          description: ''
        '401':
          description: Token ausente ou inválido.
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Troca usuário e senha por um token DRF.
      tags:
      - auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
  /api/clientes/:
    get:
      operationId: clientes_list
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      parameters:
      - in: query
        name: bairro_normalizado
        schema:
          type: string
      - in: query
        name: vendedor
        schema:
          type: integer
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
          description: ''
    post:
      operationId: clientes_create
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cliente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cliente'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
  /api/clientes/{id_cliente}/:
    get:
      operationId: clientes_retrieve
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      parameters:
      - in: path
        name: id_cliente
        schema:
          type: string
        description: Um valor único que identifica este Cliente.
        required: true
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    put:
      operationId: clientes_update
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      parameters:
      - in: path
        name: id_cliente
        schema:
          type: string
        description: Um valor único que identifica este Cliente.
        required: true
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cliente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cliente'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    patch:
      operationId: clientes_partial_update
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      parameters:
      - in: path
        name: id_cliente
        schema:
          type: string
        description: Um valor único que identifica este Cliente.
        required: true
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCliente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCliente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCliente'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    delete:
      operationId: clientes_destroy
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      parameters:
      - in: path
        name: id_cliente
        schema:
          type: string
        description: Um valor único que identifica este Cliente.
        required: true
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteConflict'
          description: ''
  /api/clientes/bairro/{nome}/:
    get:
      operationId: clientes_bairro_list
      description: |-
        Lista clientes por bairro normalizado.
        Aceita tanto o nome exato ('Águas Claras') quanto variações sem acento
        ou informais ('aguas claras', 'guara ii', 'vte pires') usando a regra do ETL!
      parameters:
      - in: query
        name: bairro_normalizado
        schema:
          type: string
      - in: path
        name: nome
        schema:
          type: string
        required: true
      - in: query
        name: vendedor
        schema:
          type: integer
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
          description: ''
  /api/clientes/vendedor/{id_vendedor}/:
    get:
      operationId: clientes_vendedor_list
      description: Lista clientes atendidos por um vendedor específico.
      parameters:
      - in: query
        name: bairro_normalizado
        schema:
          type: string
      - in: path
        name: id_vendedor
        schema:
          type: integer
        required: true
      - in: query
        name: vendedor
        schema:
          type: integer
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Sinal mínimo de saúde, sem detalhes internos do ambiente.
      tags:
      - health
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/vendedores/:
    get:
      operationId: vendedores_list
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendedor'
          description: ''
    post:
      operationId: vendedores_create
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vendedor'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
  /api/vendedores/{id_vendedor}/:
    get:
      operationId: vendedores_retrieve
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    put:
      operationId: vendedores_update
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Vendedor.
        required: true
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vendedor'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    patch:
      operationId: vendedores_partial_update
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Vendedor.
        required: true
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    delete:
      operationId: vendedores_destroy
      description: CRUD com proteção de vínculos e representações específicas por
        usuário.
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteConflict'
          description: ''
  /api/vendedores/{id_vendedor}/clientes/:
    get:
      operationId: vendedores_clientes_list
      description: |-
        Rota exigida pelo PDF: /api/vendedores/{id}/clientes/
        Lista todos os clientes atendidos pelo vendedor informado.
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
          description: ''
components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          title: Nome de usuário
        password:
          type: string
          writeOnly: true
          title: Senha
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    Cliente:
      type: object
      description: Nas consultas públicas, apenas os finais do CNPJ e do telefone
        e a inicial e o domínio do e-mail são visíveis.
      properties:
        id_cliente:
          type: string
          maxLength: 20
        razao_social:
          type: string
          maxLength: 150
        cnpj_normalizado:
          type: string
          maxLength: 14
        telefone_normalizado:
          type: string
          maxLength: 11
        email:
          type: string
          maxLength: 150
        bairro_normalizado:
          type: string
          maxLength: 100
        cep_normalizado:
          type: string
          nullable: true
          maxLength: 8
        cidade:
          type: string
          maxLength: 50
        uf:
          type: string
          maxLength: 2
        data_cadastro_normalizado:
          type: string
          format: date
        vendedor_id:
          type: integer
      required:
      - bairro_normalizado
      - cidade
      - cnpj_normalizado
      - data_cadastro_normalizado
      - email
      - id_cliente
      - razao_social
      - telefone_normalizado
      - uf
      - vendedor_id
    DashboardUser:
      type: object
      properties:
        username:
          type: string
        can_write:
          type: boolean
      required:
      - can_write
      - username
    DeleteConflict:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        related_count:
          type: integer
      required:
      - code
      - detail
      - related_count
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    PatchedCliente:
      type: object
      description: Nas consultas públicas, apenas os finais do CNPJ e do telefone
        e a inicial e o domínio do e-mail são visíveis.
      properties:
        id_cliente:
          type: string
          maxLength: 20
        razao_social:
          type: string
          maxLength: 150
        cnpj_normalizado:
          type: string
          maxLength: 14
        telefone_normalizado:
          type: string
          maxLength: 11
        email:
          type: string
          maxLength: 150
        bairro_normalizado:
          type: string
          maxLength: 100
        cep_normalizado:
          type: string
          nullable: true
          maxLength: 8
        cidade:
          type: string
          maxLength: 50
        uf:
          type: string
          maxLength: 2
        data_cadastro_normalizado:
          type: string
          format: date
        vendedor_id:
          type: integer
    PatchedVendedor:
      type: object
      properties:
        id_vendedor:
          type: integer
          readOnly: true
        nome_vendedor:
          type: string
          maxLength: 100
    Vendedor:
      type: object
      properties:
        id_vendedor:
          type: integer
          readOnly: true
        nome_vendedor:
          type: string
          maxLength: 100
      required:
      - id_vendedor
      - nome_vendedor
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
