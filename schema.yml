  /api/vendedores/:
    get:
      operationId: vendedores_list
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendedor'
          description: ''
    post:
      operationId: vendedores_create
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vendedor'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
  /api/vendedores/{id_vendedor}/:
    get:
      operationId: vendedores_retrieve
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: A unique integer value identifying this Vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    put:
      operationId: vendedores_update
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: A unique integer value identifying this Vendedor.
        required: true
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vendedor'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    patch:
      operationId: vendedores_partial_update
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: A unique integer value identifying this Vendedor.
        required: true
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    delete:
      operationId: vendedores_destroy
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: A unique integer value identifying this Vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    PatchedVendedor:
      type: object
      properties:
        id_vendedor:
          type: integer
          readOnly: true
        nome_vendedor:
          type: string
          maxLength: 100
    Vendedor:
      type: object
      properties:
        id_vendedor:
          type: integer
          readOnly: true
        nome_vendedor:
          type: string
          maxLength: 100
      required:
      - id_vendedor
      - nome_vendedor
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
