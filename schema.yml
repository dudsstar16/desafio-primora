openapi: 3.0.3
info:
  title: API Primora — Distribuidora Vetor
  version: 1.0.0
  description: Documentação interativa da API REST de Clientes e Vendedores (após tratamento ETL)
paths:
  /api/auth/token/:
    post:
      operationId: auth_token_create
      tags:
      - auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
  /api/clientes/:
    get:
      operationId: clientes_list
      description: Lista todos os clientes tratados e padronizados pelo pipeline de ETL.
      parameters:
      - in: query
        name: bairro_normalizado
        schema:
          type: string
      - in: query
        name: vendedor
        schema:
          type: integer
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
          description: ''
    post:
      operationId: clientes_create
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cliente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cliente'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
  /api/clientes/{id_cliente}/:
    get:
      operationId: clientes_retrieve
      parameters:
      - in: path
        name: id_cliente
        schema:
          type: string
        description: Identificador único do cliente (ex. CLI0001).
        required: true
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    put:
      operationId: clientes_update
      parameters:
      - in: path
        name: id_cliente
        schema:
          type: string
        required: true
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cliente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cliente'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    patch:
      operationId: clientes_partial_update
      parameters:
      - in: path
        name: id_cliente
        schema:
          type: string
        required: true
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCliente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCliente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCliente'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    delete:
      operationId: clientes_destroy
      parameters:
      - in: path
        name: id_cliente
        schema:
          type: string
        required: true
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/clientes/bairro/{nome}/:
    get:
      operationId: clientes_buscar_por_bairro
      description: |-
        Lista clientes por bairro normalizado.
        Aceita tanto o nome exato ('Águas Claras') quanto variações sem acento
        ou informais ('aguas claras', 'guara ii', 'vte pires') usando a regra do ETL!
      parameters:
      - in: path
        name: nome
        schema:
          type: string
        required: true
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
          description: ''
  /api/clientes/vendedor/{id_vendedor}/:
    get:
      operationId: clientes_buscar_por_vendedor
      description: Lista clientes atendidos por um vendedor específico.
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: string
        required: true
      tags:
      - clientes
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/vendedores/:
    get:
      operationId: vendedores_list
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendedor'
          description: ''
    post:
      operationId: vendedores_create
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vendedor'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
  /api/vendedores/{id_vendedor}/:
    get:
      operationId: vendedores_retrieve
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: A unique integer value identifying this Vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    put:
      operationId: vendedores_update
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: A unique integer value identifying this Vendedor.
        required: true
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vendedor'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    patch:
      operationId: vendedores_partial_update
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: A unique integer value identifying this Vendedor.
        required: true
      tags:
      - vendedores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVendedor'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
          description: ''
    delete:
      operationId: vendedores_destroy
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        description: A unique integer value identifying this Vendedor.
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/vendedores/{id_vendedor}/clientes/:
    get:
      operationId: vendedores_listar_clientes_do_vendedor
      description: |-
        Rota exigida pelo PDF: /api/vendedores/{id}/clientes/
        Lista todos os clientes atendidos pelo vendedor informado.
      parameters:
      - in: path
        name: id_vendedor
        schema:
          type: integer
        required: true
      tags:
      - vendedores
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
          description: ''
components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    Cliente:
      type: object
      properties:
        id_cliente:
          type: string
          maxLength: 20
        razao_social:
          type: string
          maxLength: 150
        cnpj_normalizado:
          type: string
          maxLength: 14
        telefone_normalizado:
          type: string
          maxLength: 11
        email:
          type: string
          maxLength: 150
        bairro_normalizado:
          type: string
          maxLength: 100
        cep_normalizado:
          type: string
          nullable: true
          maxLength: 8
        cidade:
          type: string
          maxLength: 50
        uf:
          type: string
          maxLength: 2
        data_cadastro_normalizado:
          type: string
          format: date
        vendedor_id:
          type: integer
      required:
      - bairro_normalizado
      - cidade
      - cnpj_normalizado
      - data_cadastro_normalizado
      - email
      - id_cliente
      - razao_social
      - telefone_normalizado
      - uf
      - vendedor_id
    PatchedCliente:
      type: object
      properties:
        id_cliente:
          type: string
          maxLength: 20
        razao_social:
          type: string
          maxLength: 150
        cnpj_normalizado:
          type: string
          maxLength: 14
        telefone_normalizado:
          type: string
          maxLength: 11
        email:
          type: string
          maxLength: 150
        bairro_normalizado:
          type: string
          maxLength: 100
        cep_normalizado:
          type: string
          nullable: true
          maxLength: 8
        cidade:
          type: string
          maxLength: 50
        uf:
          type: string
          maxLength: 2
        data_cadastro_normalizado:
          type: string
          format: date
        vendedor_id:
          type: integer
    PatchedVendedor:
      type: object
      properties:
        id_vendedor:
          type: integer
          readOnly: true
        nome_vendedor:
          type: string
          maxLength: 100
    Vendedor:
      type: object
      properties:
        id_vendedor:
          type: integer
          readOnly: true
        nome_vendedor:
          type: string
          maxLength: 100
      required:
      - id_vendedor
      - nome_vendedor
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
